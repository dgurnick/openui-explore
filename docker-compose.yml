services:

  # ---- OpenUI backend (built from local submodule source) ----
  #
  # Build context is backend/backend (the Python package folder).
  # The multi-stage Dockerfile bakes the uv virtualenv into the image.
  # For hot-reload, only the openui Python package source is bind-mounted
  # over /app/openui so the .venv at /app/.venv remains intact.
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    image: openui-explore-backend:dev
    container_name: openui-backend
    # Port 7878 exposed for direct local dev access.
    # In production, remove this - only the BFF should be reachable externally.
    ports:
      - "7878:7878"
    env_file:
      - .env
    environment:
      - OPENUI_DEV_MODE=${OPENUI_DEV_MODE:-true}
    volumes:
      # Live-mount only the Python source so edits are picked up by hot-reload.
      # The .venv installed at /app/.venv during the Docker build is preserved.
      - ./backend/backend/openui:/app/openui
    command: ["python", "-m", "openui", "--dev"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Ktor BFF (Backend for Frontend) ----
  #
  # Sits between the mobile app and the OpenUI backend.
  # Handles JWT authentication and request/response logging.
  # All mobile API traffic flows through this service.
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    image: openui-explore-bff:dev
    container_name: openui-bff
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Internal Docker network URL - backend not exposed externally when BFF is used
      - OPENUI_BACKEND_URL=http://openui-backend:7878
      - DATABASE_PATH=/data/openui-bff.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - BFF_ADMIN_USERNAME=${BFF_ADMIN_USERNAME:-admin}
      - BFF_ADMIN_PASSWORD=${BFF_ADMIN_PASSWORD:-changeme}
    volumes:
      - bff_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Optional Ollama sidecar ----
  # Uncomment to run a local model without installing Ollama on the host.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: openui-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  bff_data:  # Persists the SQLite database across container restarts
  # ollama_data:
