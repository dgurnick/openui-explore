services:

  # ---- OpenUI backend (built from local submodule source) ----
  #
  # Build context is backend/backend (the Python package folder).
  # The multi-stage Dockerfile bakes the uv virtualenv into the image.
  # For hot-reload, only the openui Python package source is bind-mounted
  # over /app/openui so the .venv at /app/.venv remains intact.
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    image: openui-explore-backend:dev
    container_name: openui-backend
    ports:
      - "${OPENUI_PORT:-7878}:7878"
    env_file:
      - .env
    environment:
      - OPENUI_DEV_MODE=${OPENUI_DEV_MODE:-true}
    volumes:
      # Live-mount only the Python source so edits are picked up by hot-reload.
      # The .venv installed at /app/.venv during the Docker build is preserved.
      - ./backend/backend/openui:/app/openui
    # --dev enables uvicorn --reload so source changes restart the server.
    command: ["python", "-m", "openui", "--dev"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Optional Ollama sidecar ----
  # Uncomment to run a local model without installing Ollama on the host.
