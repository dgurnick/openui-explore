ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.dgurnick.openuiexplore.bff.ApplicationKt.module ]
    }
}

jwt {
    # Override JWT_SECRET in production - never use the default
    secret = "dev-secret-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "openui-bff"
    audience = "openui-mobile"
    realm = "OpenUI BFF"
    expirationHours = 24
}

openui {
    backendUrl = "http://localhost:7878"
    backendUrl = ${?OPENUI_BACKEND_URL}
}

database {
    path = "./openui-bff.db"
    path = ${?DATABASE_PATH}
}
